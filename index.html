<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Converter</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <header>
      <h1>Image Converter</h1>
      <p>🔒Converti le tue immagini in modo privato e sicuro.</p>
    </header>

    <main>
      <input type="file" id="file-input" accept="image/jpeg, image/png, image/webp" multiple/>
      <p id="message"></p>

      <div id="controls">
        <label for="format">Converti in:</label>
        <select id="format" disabled></select>
        <button id="convert-btn" disabled>Converti tutto</button>
        <a id="download-link" hidden>Scarica tutto (ZIP)</a>
      </div>
      
      <ul id="grid"></ul>
    </main>

    <script src="zip.js"></script>
    <script src="app.js"></script>
  </body>
</html>
